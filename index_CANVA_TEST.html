/* Builder Quest game upgrade */
.game-hero{background:linear-gradient(115deg,#173e64,#087e85);color:white;border-radius:23px;padding:23px;margin-bottom:16px;box-shadow:0 8px 26px #12344b24}

/* Builder City — original toy-block-inspired art, no third-party trademarks */
.city-hero{border-radius:22px;padding:22px;background:linear-gradient(115deg,#124c62,#0c9c91);color:white;margin:15px 0}.city-hero p{color:#e6fffb}.city-world{background:linear-gradient(#9ce0fa 0%,#def6fd 67%,#a9d99d 67%);border:5px solid #fff;border-radius:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:22px 14px;min-height:330px;box-shadow:0 5px 17px #143e4a22}.city-plot{position:relative;min-height:135px;border:2px dashed #388474;border-radius:17px;background:#ffffff83;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center;padding:9px}.city-plot.built{border:2px solid #67a48a;background:#ffffffbd}.city-plot .structure{font-size:60px;line-height:1.15;filter:drop-shadow(2px 5px 0 #274c4b32);animation:city-rise .4s ease-out}.city-plot .studs{letter-spacing:5px;font-size:13px;color:#527d80}.city-plot strong{font-size:13px;color:#14394b}.city-plot small{font-size:11px;color:#476475}.city-shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin:14px 0}.city-item{background:white;border:2px solid #d2e3e9;border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center}.city-item .art{font-size:48px}.city-item button{width:100%;margin-top:auto}.city-item.owned{background:#e7fbef;border-color:#68b288}.city-feedback{padding:12px;border-radius:12px;background:#e6f6ff;color:#153c5b;margin:12px 0}.city-help{font-size:13px;line-height:1.6;color:#4d6571}.city-stars{font-size:20px}@keyframes city-rise{from{transform:translateY(25px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@media(max-width:600px){.city-world{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}.city-plot{min-height:125px}}

/* Interactive toy brick world */

/* Professional Digital Weekly Planner — isolated from Bryson mode and Builder City */
.planner-shell{background:#f7f9fc;border:1px solid #dce4ee;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 8px 26px #142d4d0c}

sistence."},{"q":"Which character trait helped the group?","opts":["Teamwork","Selfishness","Carelessness"],"a":0,"why":"Working together helped solve the challenge."},{"q":"Which detail happened near the end?","opts":["They succeeded after making changes","They had not started","No one tried anything"],"a":0,"why":"The resolution happens after their improvement."}]},{"title":"The Tower Team Challenge — Fluency","teach":"Read again with expression. Retell the beginning, middle and end.","passage":"At Builder Club, four friends entered a tower challenge. They had one basket of blocks and twenty minutes to design a strong building. Kai wanted a very tall tower. Sofia wanted a wide base. Eli suggested they test a small model before using all their blocks. The team listened to every idea and agreed to try Sofia's base with Kai's tall design. During the first test, the top leaned sideways. They noticed the blocks did not overlap, leaving weak lines between the layers. Eli showed the team how to stagger the bricks like the pattern on a wall. This made the tower steadier. When the timer rang, their building was not the tallest, but it could hold a small toy truck. The group cheered. Their guide praised them for listening, testing, and improving their design. On the way home, Kai said, 'Working together made our tower stronger than any of us could build alone.'","questions":[{"q":"Which detail happened near the end?","opts":["They succeeded after making changes","They had not started","No one tried anything"],"a":0,"why":"The resolution happens after their improvement."},{"q":"What does sturdy mean?","opts":["Strong and steady","Tiny and wet","Extremely loud"],"a":0,"why":"Sturdy means well-built and steady."},{"q":"Which is a good summary?","opts":["Friends solve a building challenge by cooperating","A dragon visits the town","The children go swimming"],"a":0,"why":"A summary names the problem and main solution."}]},{"title":"The Tower Team Challenge — Story Detective","te const SOCIAL_EXPLORERS=[{"week":1,"day":1,"unit":"Citizenship Adventures","strand":"Communities","title":"Our Neighborhood","objective":"I can explain our neighborhood.","teach":"A community is a place where people live, work, and help one another. Name places you visit in your neighborhood.","activity":"Draw a neighborhood map with a home, library, store, and park. Tell Mom how one place helps people.","questions":[{"q":"Which place lends books to the community?","opts":["Library","Bakery","Garage"],"a":0,"why":"A library lends books and shares information."},{"q":"What makes a community?","opts":["Only cars","People helping each other","Only tall buildings"],"a":1,"why":"A community includes people and the places they share."}]},{"week":1,"day":2,"unit":"Citizenship Adventures","strand":"Civics","title":"Rules Keep Us Safe","objective":"I can explain rules keep us safe.","teach":"Rules help people stay safe and treat one another fairly. Rules can be different at home, the library, and the playground.","activity":"Choose one place you visit. Draw one helpful rule for that place and explain why it matters.","questions":[{"q":"Why do we take turns?","opts":["To skip everyone","To be fair","To make others upset"],"a":1,"why":"Taking turns is fair."},{"q":"Which is a safe playground choice?","opts":["Push someone","Climb a closed slide","Wait for your turn"],"a":2,"why":"Following rules helps keep people safe."}]},{"week":1,"day":3,"unit":"Citizenship Adventures","strand":"Communities","title":"Helpers in Our Town","objective":"I can explain helpers in our town.","teach":"A librarian helps us find books. Firefighters respond to fires and other emergencies. Mail carriers deliver mail. Many jobs help a community.","activity":"Build a small community with toy bricks. Give each building a helper who works there.","questions":[{"q":"Who helps you find a book?","opts":["Pilot","Chef","Librarian"],"a":2,"why":"Librarians help us find books."},{"q":"Who brings letters to homes?","opts":["Mail carrier","Dentist","Farmer"],"a":0,"why":"Mail carriers deliver mail."}]},{"week":1,"day":4,"unit":"Citizenship Adventures","strand":"Citizenship","title":"Being a Helpful Citizen","objective":"I can explain being a helpful citizen.","teach":"Good citizens show respect, care for shared places, and try to solve problems kindly. Everyone can help in small ways.","activity":"Pick a helpful act for today. Explain what you did and how it helped someone.","questions":[{"q":"What shows respect?","opts":["Listening when someone talks","Taking their things","Laughing at mistakes"],"a":0,"why":"Listening is respectful."},{"q":"Which action helps a shared space?","opts":["Break a bench","Put litter in a bin","Leave trash on the ground"],"a":1,"why":"Caring for shared places helps everyone."}]},{"week":2,"day":1,"unit":"Citizenship & Simple Geography","strand":"Geography","title":"My Town, State, and Country","objective":"I can explain my town, state, and country.","teach":"San Antonio is a city in Texas. Texas is a state in the United States. A city is inside a state, and a state is inside a country.","activity":"Draw three nested shapes and label them San Antonio, Texas, and United States.","questions":[{"q":"Texas is a…","opts":["Planet","State","City"],"a":1,"why":"Texas is a state."},{"q":"San Antonio is in…","opts":["Canada","The ocean","Texas"],"a":2,"why":"San Antonio is a city in Texas."}]},{"week":2,"day":2,"unit":"Citizenship & Simple Geography","strand":"Geography","title":"Reading a Simple Map","objective":"I can explain reading a simple map.","teach":"A map shows where places are. Map symbols stand for real things such as parks, schools, and roads. A map key tells what each symbol means.","activity":"Make a map of a toy town using four symbols and a map key.","questions":[{"q":"What tells us what map symbols mean?","opts":["Book title","Clock","Map key"],"a":2,"why":"A map key explains symbols."},{"q":"Which symbol might mark a park?","opts":["A t function originalSchoolDate(w,d){const base=new Date((st.startDate||'2026-10-12')+'T12:00:00');base.setDate(base.getDate()-((base.getDay()+6)%7)+(w-1)*7+d-1);return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`}

function dateAdvance(day){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function isClosed(date){return ['sick','holiday','absent'].includes(st.attendance?.[date]?.status)||eventsOnDate(date).some(e=>e.kind==='Holiday'&&e.noSchool===true)}
function lessonLocked(w,d){return ['math','reading','writing','scisoc','review','break'].some(k=>done(w,d,k))||['present','fieldtrip'].includes(st.attendance?.[schoolDateFor(w,d)]?.status)}
let schedulePreview=null;
function buildReschedulePreview(){
 const rows=[];for(let w=1;w<=36;w++)for(let d=1;d<=4;d++)rows.push({key:`${w}-${d}`,w,d,old:schoolDateFor(w,d),fixed:lessonLocked(w,d)});
 // Propose only moving lessons on/after first impacted closure, leaving earlier and completed days untouched.
 const impact=rows.findIndex(r=>!r.fixed&&isClosed(r.old));
 if(impact<0){schedulePreview={error:'No uncompleted lessons fall on a date marked Sick, Holiday/Break, or Absent. Mark a date in Attendance first.'};render();return}
 const used=new Set(rows.filter(r=>r.fixed||rows.indexOf(r)<impact).map(r=>r.old));
 const changes=[];let cursor=rows[impact].old;
 for(let i=impact;i<rows.length;i++){
  const r=rows[i];if(r.fixed){used.add(r.old);if(r.old>=cursor)cursor=dateAdvance(r.old);continue}
  if(r.old>cursor)cursor=r.old;
  let guard=0;
  while((!([1,2,3,4].includes(new Date(cursor+'T12:00:00').getDay()))||isClosed(cursor)||used.has(cursor))&&guard++<1000)cursor=dateAdvance(cursor);
  if(guard>=1000){schedulePreview={error:'Could not find enough eligible school days.'};render();return}
  if(cursor!==r.old)changes.push({...r,next:cursor});
  used.add(cursor);cursor=dateAdvance(cursor);
 }
 schedulePreview={changes,impact:rows[impact].old};render();
}

  body=`<p class="mathlab-help">Build a number with groups of ten and single blocks. Trade 10 ones for a ten!</p><div class="mathlab-count" aria-live="polite">${mathTens} tens + ${mathOnes} ones = ${mathTens*10+mathOnes}</div><div class="mathlab-pieces">${rod.repeat(mathTens)}${'<span class="mathlab-one" aria-label="one"></span>'.repeat(mathOnes)}</div><div class="mathlab-actions"><button onclick="changeMathBlocks('ten',1)">+ 1 ten</button><button onclick="changeMathBlocks('ten',-1)">− 1 ten</button><button onclick="changeMathBlocks('one',1)">+ 1 one</button><button onclick="changeMathBlocks('one',-1)">− 1 one</button><button onclick="tradeMathTen()">Trade 10 ones ⇄ 1 ten</button><button onclick="resetMathTool()">Reset</button></div>`;
 }else if(mathToolMode==='frames'){
  body=`<p class="mathlab-help">Tap a square to fill it. Can you make 10? How many are empty?</p><div class="mathlab-count" aria-live="polite">${mathFilled} filled · ${20-mathFilled} empty · ${Math.floor(mathFilled/10)} full ten(s)</div><div class="mathlab-frames">${[0,1].map(f=>`<div class="mathlab-frame" aria-label="Ten frame ${f+1}">${Array.from({length:10},(_,i)=>{let idx=f*10+i;return `<button class="mathlab-cell ${idx<mathFilled?'on':''}" aria-label="Set filled squares to ${idx+1}" aria-pressed="${idx<mathFilled}" onclick="setMathFilled(${idx+1})"></button>`}).join('')}</div>`).join('')}</div><div class="mathlab-actions"><button onclick="setMathFilled(mathFilled-1)">− 1</button><button onclick="setMathFilled(mathFilled+1)">+ 1</button><button onclick="setMathFilled(10)">Make 10</button><button onclick="setMathFilled(0)">Clear</button></div>`;
 }else{
  body=`<p class="mathlab-help">Tap a number or jump forward/back. Use jumps to model addition and subtraction.</p><div class="mathlab-count" aria-live="polite">Current position: ${mathLinePosition}</div><div class="mathlab-line">${Array.from({length:21},(_,i)=>`<button class="${i===mathLinePosition?'on':''}" aria-label="Go to ${i}" aria-pressed="${i===mathLinePosition}" onclick="setMathLine(${i})">${i}</button>`).join('')}</div><div class="mathlab-actions"><button onclick="setMathLine(mathLinePosition-10)">− 10</button><button onclick="setMathLine(mathLinePosition-1)">− 1</button><button onclick="setMathLine(mathLinePosition+1)">+ 1</button><button onclick="setMathLine(mathLinePosition+10)">+ 10</button><button onclick="setMathLine(0)">Start at 0</button></div>`;
 }
 return `<details class="mathlab" aria-label="Math Blocks"><summary>🧱 Math Blocks <span class="mathlab-summary-help">Need help? Tap to build and count</span></summary><div class="mathlab-content"><p class="mathlab-help">Choose one tool. Try it while you solve a question. Your score won't change.</p><div class="mathlab-tabs" role="group" aria-label="Choose math tool">${tabs.map(([id,label])=>`<button class="${mathToolMode===id?'active':''}" aria-pressed="${mathToolMode===id}" onclick="setMathMode('${id}')">${label}</button>`).join('')}</div><div id="mathlab-body">${body}</div><button class="btn outline" onclick="mathHelp=!mathHelp;refreshMathLab()">💡 Show Me How</button>${mathHelp?`<p class="mathlab-help" role="status">${mathToolMode==='blocks'?'Example: 47 = four tens and seven ones. Press + 1 ten four times, then + 1 one seven times. Ten ones can be traded for a ten.':mathToolMode==='frames'?'Example: To solve 8 + 7, fill 8 squares, then add 2 to make 10. Five remain, so 10 + 5 = 15.':'Example: To solve 13 − 5, tap 13 and then press − 1 five times. You land on 8.'}</p>`:''}</div></details>`;

function refreshMathLab(){const e=document.querySelector('.mathlab');if(e){const wasOpen=e.open;e.outerHTML=mathToolHTML(st.week);document.querySelector('.mathlab').open=wasOpen}}
function setMathMode(m){mathToolMode=m;mathHelp=false;refreshMathLab()}
function changeMathBlocks(type,n){if(type==='ten')mathTens=Math.max(0,Math.min(12,mathTens+n));else{if(n>0&&mathOnes===9){if(mathTens<12){mathOnes=0;mathTens++}}else mathOnes=Math.max(0,mathOnes+n)}refreshMathLab()}
function tradeMathTen(){if(mathTens>0&&mathOnes<10){mathTens--;mathOnes+=10;mathOnes=Math.min(19,mathOnes)}else if(mathOnes>=10&&mathTens<12){mathOnes-=10;mathTens++}else{mathHelp=true}refreshMathLab()}
function resetMathTool(){mathTens=3;mathOnes=4;mathHelp=false;refreshMathLab()}
function setMathFilled(n){mathFilled=Math.min(20,Math.max(0,n));refreshMathLab()}
function setMathLine(n){mathLinePosition=Math.min(20,Math.max(0,n));refreshMathLab()}

const READING_GAME_BANK=[
  {pairs:[['foundation','Strong base under a building'],['wobble','Shake from side to side'],['carefully','With close attention']],words:['A','strong','base','helps','the','tower','.'],sentence:'A strong base helps the tower.'},
  {pairs:[['engineer','Someone who designs solutions'],['grip','Hold firmly'],['rover','Vehicle used to explore']],words:['The','rover','crossed','the','grass','.'],sentence:'The rover crossed the grass.'},
  {pairs:[['garden','A place where plants grow'],['bright','Full of light'],['greet','Say hello']],words:['We','can','read','and','learn','together','.'],sentence:'We can read and learn together.'},
  {pairs:[['river','A moving body of water'],['bridge','Structure that crosses a gap'],['plan','Idea for what to do']],words:['The','bridge','was','strong','and','safe','.'],sentence:'The bridge was strong and safe.'},
  {pairs:[['patient','Able to wait calmly'],['repair','Fix something broken'],['discover','Find something new']],words:['I','can','try','a','new','idea','.'],sentence:'I can try a new idea.'},
  {pairs:[['habitat','An animal’s natural home'],['observe','Look closely'],['collect','Bring things together']],words:['We','look','for','clues','in','the','story','.'],sentence:'We look for clues in the story.'}
];
function readingGameKey(w,d){return 'reading-game-'+w+'-'+d}
function readingGameData(w){return READING_GAME_BANK[Math.max(0,Math.min(5,w-1))]}
function readingGameState(w,d){const k=readingGameKey(w,d);const v=st.notes[k];return v&&typeof v==='object'?v:{matches:{},chosen:[],matchSelect:-1}}
function readingGamesHTML(w,d){const data=readingGameData(w),v=readingGameState(w,d);const solved=data.pairs.every((p,i)=>v.matches[i]===i);const sorted=v.chosen.map(i=>data.words[i]).join(' ').replace(/ \./g,'.');const complete=sorted===data.sentence;return `<section class="reading-games"><h3>📚 Reading Games</h3><p class="sub">Two quick games before your story questions. Take your time!</p><div class="reading-mini"><b>🔍 Word Detective</b><p>Tap a word, then tap what it means.</p><div>${data.pairs.map((p,i)=>`<button class="choice ${v.matchSelect===i?'selected':''}" onclick="readingSelectWord(${w},${d},${i})">${v.matches[i]===i?'✅ ':''}${esc(p[0])}</button>`).join('')}</div><div>${data.pairs.map((p,i)=>`<button class="choice" onclick="readingSelectMeaning(${w},${d},${i})">${esc(p[1])}</button>`).join('')}</div><div class="reading-result" role="status">${solved?'🏆 You matched all three words!':Object.keys(v.matches).filter(i=>v.matches[i]===Number(i)).length+' of 3 matched'}</div></div><div class="reading-mini"><b>🧱 Build a Sentence</b><p>Tap the words in order to make a sentence.</p><div class="reading-words">${v.chosen.map((i,pos)=>`<button class="choice" onclick="readingRemoveWord(${w},${d},${pos})">${esc(data.words[i])} ×</button>`).join('')||'<span>Tap words below to build your sentence</span>'}</div><div>${data.words.map((word,i)=>v.chosen.includes(i)?'':`<button class="choice" onclick="readingAddWord(${w},${d},${i})">${esc(word)}</button>`).join('')}</div><div class="reading-result" role="status">${complete?'🎉 You built a complete sentence!':v.chosen.length===data.words.length?'Not quite yet. Tap words above to fix the order.':'Build the whole sentence to finish!'}</div><button class="btn outline" onclick="readingClearSentence(${w},${d})">↻ Start sentence over</button></div><p class="reading-badge">These learning games are ungraded practice. Your comprehension score saves separately below.</p></section>`}
function saveReadingGame(w,d,v){st.notes[readingGameKey(w,d)]=v;save()}
function readingSelectWord(w,d,i){const v=readingGameState(w,d);v.matchSelect=i;saveReadingGame(w,d,v)}
function readingSelectMeaning(w,d,i){const v=readingGameState(w,d);if(v.matchSelect<0){feedback='Choose a word first.';render();return}if(v.matchSelect===i){v.matches[i]=i;feedback='✅ Great word match!'}else{feedback='Try another meaning.'}v.matchSelect=-1;saveReadingGame(w,d,v)}
function readingAddWord(w,d,i){const v=readingGameState(w,d);if(!v.chosen.includes(i)){v.chosen.push(i);saveReadingGame(w,d,v)}}
function readingRemoveWord(w,d,pos){const v=readingGameState(w,d);v.chosen.splice(pos,1);saveReadingGame(w,d,v)}
function readingClearSentence(w,d){const v=readingGameState(w,d);v.chosen=[];saveReadingGame(w,d,v)}

let mathScreenStep=0;let mathLastLesson='';
function mathStepTo(n){mathScreenStep=Math.max(0,Math.min(n,99));render();}
let readingScreenStep=0;let readingLastLesson='';
function readingStepTo(n){readingScreenStep=Math.max(0,Math.min(n,99));render();}
function readingSimpleText(p){return String(p||'').replace(/magnificent/gi,'amazing').replace(/experimenting/gi,'trying').replace(/structure/gi,'building').replace(/collapsed/gi,'fell down').replace(/foundation/gi,'base').replace(/sturdy/gi,'strong').replace(/frustrated/gi,'upset').replace(/approximately/gi,'about');}
function readingFocusedLesson(l,w,d){const key=completionKey(w,d,'reading');if(readingLastLesson!==key){readingLastLesson=key;readingScreenStep=0;}const qs=l.questions||[];const step=Math.min(readingScreenStep,qs.length+1);const total=qs.length+2;let s=`<div class="card reading-focus"><div class="row"><div><h2>📚 Reading Adventures</h2><span class="pill">Week ${w} · ${names[d-1]}</span></div><div class="reading-steps-note">${step+1} / ${total}</div></div><div class="reading-progress">${Array.from({length:total},(_,i)=>`<span class="${i<=step?'active':''}"></span>`).join('')}</div>`;
if(step===0){s+=`<div class="reading-goal"><b>Today's Reading Goal</b><p>Read carefully and use clues from the story to answer questions.</p></div><h3>${esc(l.title)}</h3><div class="reading-story">${esc(readingSimpleText(l.passage))}</div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="speakCurrentStory()">🔊 Read to Me</button></div><details class="reading-optional"><summary>Extra help from Mom</summary><p>${esc(l.teach||'Talk about the story together.')}</p></details>`;}
else if(step<=qs.length){const i=step-1,q=qs[i],chosen=st.answers[key+'-q'+i];s+=`<div class="reading-goal"><b>🎯 Reading Challenge</b><p>Think about what happened in the story.</p></div><p class="reading-steps-note">Question ${step} of ${qs.length}</p><p class="reading-question">${esc(q.q)}</p><div class="practice-list"><div class="question">${q.opts.map((o,j)=>`<button class="choice ${chosen===j?'selected':''}" onclick="st.answers['${key}-q${i}']=${j};save()">${esc(o)}</button>`).join('')}</div></div>${chosen!==undefined?`<p class="${chosen===q.a?'correct':'incorrect'}" role="status">${chosen===q.a?'✅ You found the clue!':'↻ Read the question carefully and try again.'}</p>`:''}<details class="reading-optional"><summary>Need to look back at the story?</summary><div class="reading-story">${esc(readingSimpleText(l.passage))}</div></details>`;}
else{s+=`<div class="reading-goal"><h3>🌟 Ready to finish?</h3><p>You read the story and answered ${qs.length} questions. Save your practice check below.</p></div><button class="btn" onclick="grade('${key}',${JSON.stringify(qs.map(x=>x.a))})">${st.scores[key]?'Update Saved Practice Check':'Save This Practice Check'}</button>${st.scores[key]?`<p class="notice" role="status">✅ Saved: ${st.scores[key].correct} of ${st.scores[key].total}. Your score appears in Parent Mode.</p>`:''}<label style="display:block;margin-top:14px"><input type="checkbox" style="width:auto" ${done(w,d,'reading')?'checked':''} onchange="st.completions['${key}']=this.checked;save()"> Mark reading lesson complete</label>`;}
s+=`<div class="reading-nav"><button class="btn outline" ${step===0?'disabled':''} onclick="readingStepTo(${step-1})">← Back</button>${step<total-1?`<button class="btn" ${step>0&&st.answers[key+'-q'+(step-1)]===undefined?'disabled':''} onclick="readingStepTo(${step+1})">${step===0?'Start Questions':'Next Question'} →</button>`:`<button class="btn outline" onclick="readingStepTo(0)">📖 Read Again</button>`}</div></div>`;return s;}
function mathFocusedLesson(l,w,d){
 const key=completionKey(w,d,'math');
 if(mathLastLesson!==key){mathLastLesson=key;mathScreenStep=0;}

function grade(key,answers){

me asks for personal information or a stranger sends a message.", "question": "What should you do with a strange online message?", "options": ["Tell a trusted adult", "Share your address", "Reply with your password"], "answer": 0}, {"week": 5, "day": 3, "title": "What To Do in an Emergency", "goal": "Learn how to get adult help", "activity": "With Mom, practice saying your name, finding a trusted adult, and when to call emergency services.", "question": "When should you call 911?", "options": ["For a real emergency when help is needed", "Because a game is hard", "To ask about the weather"], "answer": 0}, {"week": 5, "day": 4, "title": "Safe Community Explorer", "goal": "Use safety rules away from home", "activity": "Practice stopping at crossings, staying with your adult, and asking a trusted helper for help.", "question": "Before crossing a street, you should...", "options": ["Stop, look, listen, and follow your adult", "Run without looking", "Play in the road"], "answer": 0}, {"week": 6, "day": 1, "title": "Set a Small Goal", "goal": "Choose a goal you can practice", "activity": "Choose one helpful skill for this week. Draw or write a goal and the first small step.", "question": "Which goal is easiest to practice?", "options": ["A clear goal with a first step", "A goal with no plan", "Doing everything at once"], "answer": 0}, {"week": 6, "day": 2, "title": "Follow My Plan", "goal": "Practice and notice progress", "activity": "Review your goal, practice for a few minutes, and draw a star for effort—not speed.", "question": "What helps with a goal?", "options": ["Practice and patience", "Only trying once", "Giving up when stuck"], "answer": 0}, {"week": 6, "day": 3, "title": "Solve a Problem Together", "goal": "Listen and take turns", "activity": "Build something with Mom. Take turns sharing ideas and trying solutions.", "question": "Which behavior helps teammates?", "options": ["Listening and taking turns", "Interrupting everyone", "Taking all the pieces"], "answer": 0}, {"week": 6, "day": 4, "title": "My Life Skills Showcase", "goal": "Show a skill and reflect", "activity": "Show Mom one skill from these weeks. Explain what was hard and what you can now do.", "question": "How do you show what you learned?", "options": ["Demonstrate and explain your skill", "Say you never need practice", "Avoid trying"], "answer": 0}];
let lifeScreenStep=0,lifeScreenKey='';
function lifeGoStep(n){lifeScreenStep=Math.max(0,Math.min(3,n));render()}
function lifeSaveField(key,field,value){st.life[key]={...(st.life[key]||{}),[field]:value};try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){feedback='Save error: '+e.message}}
function lifeSetField(key,field,value){lifeSaveField(key,field,value);render()}
function life(){
 const w=st.week,d=st.day,key=w+'-'+d, lesson=LIFE_SKILLS_DATA[(w-1)*4+d-1];
 if(!lesson)return header('🌟 Life Skills Lab','Real-world independence and everyday learning')+weekControls()+`<div class="card"><h2>${esc(topic(w,'life'))}</h2><p>Guided family practice for this week. Choose one safe task to try, and discuss what you learned.</p><label>Reflection</label><textarea id="lifeOlderNote">${esc((st.life[w]||{}).notes||'')}</textarea><button class="btn" onclick="lifeSetField('${w}','notes',el('lifeOlderNote').value)">Save Notes</button></div>`;
 if(lifeScreenKey!==key){lifeScreenKey=key;lifeScreenStep=0}
 const data=st.life[key]||{},step=lifeScreenStep,answered=data.answer;
 let s=header('🌟 Life Skills Lab','Simple steps · real-world confidence')+weekControls()+dayControls();
 s+=`<div class="card reading-focus"><div class="row between"><div><h2>🌟 ${esc(lesson.title)}</h2><span class="pill">Week ${w} · ${names[d-1]}</span></div><div class="reading-steps-note">${step+1} / 4</div></div><div class="reading-progress">${Array.from({length:4},(_,i)=>`<span class="${i<=step?'active':''}"></span>`).join('')}</div>`;
 if(step===0){s+=`<div class="reading-goal"><b>Today's Life Skill</b><p>${esc(lesson.goal)}</p></div><div class="math-focus-intro"><h3>💡 Let's Learn</h3><p>${esc(lesson.activity)}</p></div><p class="sub">Take your time. Mom can help when you need her.</p>`}
 if(step===1){s+=`<div class="reading-goal"><b>🧱 Try It Out</b><p>Practice your new skill in real life.</p></div><p class="math-focus-question">${esc(lesson.activity)}</p><label style="display:block;margin:14px 0"><input type="checkbox" style="width:auto" ${data.practice?'checked':''} onchange="lifeSetField('${key}','practice',this.checked)"> I practiced this skill</label><details class="reading-optional"><summary>👩‍🏫 A note for Mom</summary><p>Give help when needed, then let Bryson try the safe parts independently. Praise effort and clear communication.</p></details>`}
 if(step===2){s+=`<div class="reading-goal"><b>🎯 Quick Check</b><p>Choose the best answer.</p></div><p class="math-focus-question">${esc(lesson.question)}</p><div class="practice-list"><div class="question">${lesson.options.map((op,i)=>`<button class="choice ${answered===i?'selected':''}" onclick="lifeSetField('${key}','answer',${i})">${esc(op)}</button>`).join('')}</div></div>${answered!==undefined?`<p class="${answered===lesson.answer?'correct':'incorrect'}" role="status">${answered===lesson.answer?'✅ Great thinking!':'↻ Think about the lesson and try again.'}</p>`:''}`}
 if(step===3){s+=`<div class="reading-goal"><h3>🏆 Life Skill Complete!</h3><p>Tell Mom what you tried and what you learned.</p></div><label>My reflection</label><textarea id="lifeReflection" rows="4" placeholder="Today I practiced..." oninput="lifeSaveField('${key}','notes',this.value)">${esc(data.notes||'')}</textarea><p class="sub">Your reflection saves as you type.</p><label style="display:block;margin:12px 0"><input type="checkbox" style="width:auto" ${data.shown?'checked':''} onchange="lifeSetField('${key}','shown',this.checked)"> Mom saw me demonstrate the skill</label><label style="display:block;margin:12px 0"><input type="checkbox" style="width:auto" ${done(w,d,'life')?'checked':''} onchange="st.completions['${completionKey(w,d,'life')}']=this.checked;save()"> Mark lesson complete</label>`}
 s+=`<div class="reading-nav"><button class="btn outline" ${step===0?'disabled':''} onclick="lifeGoStep(${step-1})">← Back</button>${step<3?`<button class="btn" ${step===2&&answered!==lesson.answer?'disabled':''} onclick="lifeGoStep(${step+1})">${step===0?'Start Activity':step===1?'Quick Check':'Finish Mission'} →</button>`:`<button class="btn outline" onclick="lifeGoStep(1)">↻ Review Activity</button>`}</div></div>`;
 return s;
}
function progress(){let c=Object.values(st.completions).filter(Boolean).length;let s=Object.entries(st.scores);return header('Progress & Mastery','Track what was demonstrated, without invented grades')+`<div class="grid"><div class="card"><div class="big">${c}</div><p>Completed learning blocks</p></div><div class="card"><div class="big">${s.length}</div><p>Saved practice checks</p></div><div class="card"><div class="big">${Object.values(st.life).filter(x=>x.shown).length}</div><p>Demonstrated life skills</p></div></div><div class="card"><h2>Mastery journal</h2><p class="sub">Independent mastery requires parent confirmation after repeated successful practice; a single quiz never marks mastery automatically.</p>${subjects.map(k=>`<div class="day row between"><strong>${subjLabels[k]}</strong><select style="max-width:190px" onchange="st.mastery['${st.week}-${k}']=this.value;save()">${['not started','developing','independent'].map(v=>`<option ${st.mastery[st.week+'-'+k]===v?'selected':''} value="${v}">${v}</option>`).join('')}</select></div>`).join('')}</div><div class="card"><h2>Saved practice scores</h2>${s.length?s.slice(-30).reverse().map(([k,v])=>`<div class="day">${esc(k)} — ${v.correct}/${v.total} (${Math.round(v.correct/v.total*100)}%)</div>`).join(''):'<p>No completed checks yet. This is normal at the start of the year.</p>'}</div>`}
function resources(){return header('Resource Library','Recommended learning sites and printable lesson plans')+`<div class="card">${[['Khan Academy Grade 2 Math','https://www.khanacademy.org/math/cc-2nd-grade-math'],['PBS Kids','https://pbskids.org/'],['NASA Space Place','https://spaceplace.nasa.gov/'],['Starfall','https://www.starfall.com/'],['ReadWorks','https://www.readworks.org/']].map(([n,u])=>`<div class="day"><a href="${u}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a></div>`).join('')}</div><div class="card"><h2>Add family resource</h2><label>Title</label><input id="resTitle"><label>URL (https)</label><input id="resUrl"><button class="btn" onclick="addResource()">Save resource</button>${st.resources.map((r,i)=>`<div class="day"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a> <button class="btn outline" onclick="st.resources.splice(${i},1);save()">Remove</button></div>`).join('')}</div>`}
function addResource(){let title=el('resTitle').value.trim(),url=el('resUrl').value.trim();if(!title||!/^https:\/\//i.test(url)){alert('Enter a title and an https:// URL.');return}st.resources.push({title,url});save()}
function settings(){return header('Parent Settings','Edit, back up, and restore your homeschool records')+`<div class="card"><label>Student first name</label><input id="child" value="${esc(st.childName)}"><label>School start date (informational)</label><input type="date" id="start" value="${esc(st.startDate)}"><p class="sub">36 instructional weeks × 4 core days. School weeks are numbered and can be advanced manually around breaks and holidays.</p><button class="btn" onclick="st.childName=el('child').value;st.startDate=el('start').value;save()">Save settings</button></div><div class="card"><h2>Own your data</h2><p>App changes persist only in this browser/device. Export backups after each week. Changing devices or clearing browser data can erase local progress, including your Builder City.</p><div class="row"><button class="btn" onclick="exportData()">⬇ Export JSON backup</button><label class="btn outline" style="cursor:pointer">⬆ Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label><button class="btn outline" onclick="window.print()">🖨 Print this page</button></div><p class="notice">Keep the HTML app file and your JSON backups together in a private folder. No cloud sync or multi-device access is included.</p></div><div class="card"><h2>Safety and privacy</h2><p>This app has no server, no account login and no automatic sharing. Anyone with access to this browser profile can see its saved data. Avoid entering sensitive details.</p><button class="btn orange" onclick="if(confirm('Erase all locally stored progress? Export a backup first.')){localStorage.removeItem(KEY);st=defaults();save()}">Erase local progress</button></div>`}
function exportData(){let b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='little-builders-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(input){let f=input.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==1||!x.completions||!x.scores||!x.edits)throw Error('Not a valid Little Builders backup');if(confirm('Replace current saved data with imported backup?')){st={...defaults(),...x};save()}}catch(e){alert('Import failed: '+e.message)}}
render();</script></body></html>
